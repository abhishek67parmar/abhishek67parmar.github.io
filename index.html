<!DOCTYPE html>
<html>

<head>
    <title>Abhishek Parmar</title>
    <style>
        /* Main Page */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #191919;
        }

        .page1 {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page1 .page2 .page3 {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;

        }

        .page3 {
            margin-top: 10%;
            height: 100vh;
        }

        .heading {
            font-family: 'Courier New', monospace;
            font-size: 5rem;
            color: #fff;
            text-align: center;
            margin-bottom: 5%;
        }


        .container {
            position: relative;
        }

        .text {
            font-family: 'Courier New', monospace;
            font-size: 5rem;
            color: #fff;
        }

        .text:hover {
            cursor: pointer;
        }

        .text_hide {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #191919;
        }

        .text_cursor {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: transparent;
            border-left: 3px solid #fff;
        }

        a {
            text-decoration: none;
        }

        /* honey comb */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        .honeycomb {
            display: flex;
            flex-wrap: wrap;
            list-style: none;
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
            transform: translateY(34.375px);
        }

        .honeycomb-cell {
            flex: 0 1 250px;
            max-width: 250px;
            height: 137.5px;
            margin: 65.4761904762px 12.5px 25px;
            position: relative;
            padding: 0.5em;
            text-align: center;
            z-index: 1;
        }

        .honeycomb-cell__title {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            -webkit-hyphens: auto;
            -ms-hyphens: auto;
            hyphens: auto;
            word-break: break-word;
            text-transform: uppercase;
            color: rgb(240, 240, 240);

            font-weight: 700;
            font-size: 1.75em;
        }

        .honeycomb-cell__image {
            top: -1%;
            left: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 1;
            filter: invert(0.95);
        }

        .honeycomb-cell::before,
        .honeycomb-cell::after {
            content: "";
        }

        .honeycomb-cell::before,
        .honeycomb-cell::after {
            top: -50%;
            left: 0;
            width: 100%;
            height: 200%;
            display: flex;
            position: absolute;
            -webkit-clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }


        .honeycomb-cell::before {
            background: rgb(240, 240, 240);
            transform: scale(1.055);
        }

        .honeycomb-cell::after {
            background: #191919;
            /* background: #00f; */
            opacity: 1;
            transition: opacity 350ms;
        }

        .honeycomb-cell:hover .honeycomb-cell__image {
            opacity: 0;
        }

        .honeycomb-cell:hover::after {
            opacity: 0;
            z-index: 1;
        }

        .honeycomb-cell:hover::before {
            background: rgb(240, 240, 240);
            opacity: 0.1;
        }

        .honeycomb__placeholder {
            display: none;
            opacity: 0;
            width: 250px;
            margin: 0 12.5px;
        }

        @media (max-width: 550px) {
            .honeycomb-cell {
                margin: 81.25px 25px;
            }
        }

        @media (min-width: 550px) and (max-width: 825px) {
            .honeycomb-cell:nth-child(3n) {
                margin-right: calc(50% - 125px);
                margin-left: calc(50% - 125px);
            }

            .honeycomb__placeholder:nth-child(3n+5) {
                display: block;
            }
        }

        @media (min-width: 825px) and (max-width: 1100px) {
            .honeycomb-cell:nth-child(5n+4) {
                margin-left: calc(50% - 275px);
            }

            .honeycomb-cell:nth-child(5n+5) {
                margin-right: calc(50% - 275px);
            }

            .honeycomb__placeholder:nth-child(5n),
            .honeycomb__placeholder:nth-child(5n+3) {
                display: block;
            }
        }

        @media (min-width: 1100px) {
            .honeycomb-cell:nth-child(7n+5) {
                margin-left: calc(50% - 400px);
            }

            .honeycomb-cell:nth-child(7n+7),
            .honeycomb-cell:nth-child(7n+5):nth-last-child(2) {
                margin-right: calc(50% - 400px);
            }

            .honeycomb__placeholder:nth-child(7n+7),
            .honeycomb__placeholder:nth-child(7n+9),
            .honeycomb__placeholder:nth-child(7n+11) {
                display: block;
            }
        }




        /* CARDS STYLE */

        :root {
            --card-width: 220px;
            --card-height: 360px;
            --card-hover-glow: #969696;
        }

        /* Tarot Container */
        .tarot-container {
            display: flex;
            gap: 5.0rem;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
        }

        /* Card Style */
        .card {
            width: var(--card-width);
            height: var(--card-height);
            border-radius: 10px;
            cursor: pointer;
            transform-style: preserve-3d;
            transform: rotateY(0deg);
            transition: transform 0.6s ease-in-out, box-shadow 0.3s ease-in-out;
            position: relative;
            box-shadow: none;
        }

        .card:hover {
            box-shadow: 0 0 25px var(--card-hover-glow);
        }

        .card-inner {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s ease-in-out;
        }

        /* Front Design */
        .card-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;

            /* background: linear-gradient(135deg, #0f0f0f, #232323); */
            background: repeating-linear-gradient(45deg,
                    rgba(255, 255, 255, 0.04),
                    rgba(255, 255, 255, 0.04) 10px,
                    rgba(0, 0, 0, 0.04) 10px,
                    rgba(0, 0, 0, 0.04) 20px);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1.5px solid #f0f0f0;
        }

        .cert-logo {
            max-width: 95%;

        }

        /* Magical star effect */
        .particle {
            position: absolute;
            width: 15px;
            height: 13px;
            background: none;
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23fff"><path d="M12 2.5l2.9 8.95H24L17 15.65l2.9 8.95L12 18.6l-7.9 5.9L7 15.65.1 11.45h8.95z"/></svg>');
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23fff"><path d="M12 2.5l2.9 8.95H24L17 15.65l2.9 8.95L12 18.6l-7.9 5.9L7 15.65.1 11.45h8.95z"/></svg>');
            mask-repeat: no-repeat;
            -webkit-mask-repeat: no-repeat;
            mask-size: contain;
            -webkit-mask-size: contain;
            background-color: #ffd700;
            pointer-events: none;
            opacity: 1;
            box-shadow: 0 0 10px 5px #ffd700, 0 0 20px 10px rgba(255, 215, 0, 0.6);
            transition: transform 1.5s ease-out, opacity 1.5s ease-out;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            :root {
                --card-width: 180px;
                --card-height: 280px;
            }
        }
    </style>
</head>

    <script>
        function typing_animation() {
            let text_element = document.querySelector(".text");
            let text_array = text_element.innerHTML.split("");
            let text_array_slice = text_element.innerHTML.split(" ");
            let text_len = text_array.length;

            const word_len = text_array_slice.map((word) => {
                return word.length;
            })

            console.log(word_len);

            let timings = {
                easing: `steps(${Number(word_len[0] + 1)}, end)`,
                delay: 2000,
                duration: 2000,
                fill: 'forwards'
            }

            let cursor_timings = {
                duration: 700,
                iterations: Infinity,
                easing: 'cubic-bezier(0,.26,.44,.93)'
            }

            document.querySelector(".text_cursor").animate([
                {
                    opacity: 0
                },
                {
                    opacity: 0, offset: 0.7
                },
                {
                    opacity: 1
                }
            ], cursor_timings);

            if (text_array_slice.length == 1) {
                timings.easing = `steps(${Number(word_len[0])}, end)`;

                let reveal_animation = document.querySelector(".text_hide").animate([
                    { left: '0%' },
                    { left: `${(100 / text_len) * (word_len[0])}%` }
                ], timings);

                document.querySelector(".text_cursor").animate([
                    { left: '0%' },
                    { left: `${(100 / text_len) * (word_len[0])}%` }
                ], timings);

                reveal_animation.onfinish = () => {
                    setTimeout(() => {
                        document.querySelector('.text_hide').animate([
                            { left: '0%' }
                        ], {
                            duration: 2000,
                            easing: 'cubic-bezier(.73,0,.38,.88)'
                        });
                        document.querySelector('.text_cursor').animate([
                            { left: '0%' }
                        ], {
                            duration: 2000,
                            easing: 'cubic-bezier(.73,0,.38,.88)'
                        });
                        typing_animation();
                    }, 1000);
                }
            } else {
                document.querySelector(".text_hide").animate([
                    { left: '0%' },
                    { left: `${(100 / text_len) * (word_len[0] + 1)}%` }
                ], timings);

                document.querySelector(".text_cursor").animate([
                    { left: '0%' },
                    { left: `${(100 / text_len) * (word_len[0] + 1)}%` }
                ], timings);
            }


            for (let i = 1; i < text_array_slice.length; i++) {
                console.log(word_len);
                console.log(text_array_slice.length);
                const single_word_len = word_len[i];
                console.log(single_word_len);

                if (i == 1) {
                    var left_instance = (100 / text_len) * (word_len[i - 1] + 1);
                    console.log(left_instance);
                }

                let timings_2 = {
                    easing: `steps(${Number(single_word_len + 1)}, end)`,
                    delay: (2 * (i + 1) + (2 * i)) * (1000),
                    // delay: ((i*2)-1)*1000,
                    duration: 2000,
                    fill: 'forwards'
                }

                if (i == (text_array_slice.length - 1)) {
                    timings_2.easing = `steps(${Number(single_word_len)}, end)`;
                    let reveal_animation = document.querySelector(".text_hide").animate([
                        { left: `${left_instance}%` },
                        { left: `${left_instance + ((100 / text_len) * (word_len[i]))}%` }
                    ], timings_2);

                    document.querySelector(".text_cursor").animate([
                        { left: `${left_instance}%` },
                        { left: `${left_instance + ((100 / text_len) * (word_len[i]))}%` }
                    ], timings_2);

                    reveal_animation.onfinish = () => {
                        setTimeout(() => {
                            document.querySelector('.text_hide').animate([
                                { left: '0%' }
                            ], {
                                duration: 2000,
                                easing: 'cubic-bezier(.73,0,.38,.88)'
                            });
                            document.querySelector('.text_cursor').animate([
                                { left: '0%' }
                            ], {
                                duration: 2000,
                                easing: 'cubic-bezier(.73,0,.38,.88)'
                            });
                            typing_animation();
                        }, 1000);
                    }
                } else {
                    document.querySelector(".text_hide").animate([
                        { left: `${left_instance}%` },
                        { left: `${left_instance + ((100 / text_len) * (word_len[i] + 1))}%` }
                    ], timings_2);

                    document.querySelector(".text_cursor").animate([
                        { left: `${left_instance}%` },
                        { left: `${left_instance + ((100 / text_len) * (word_len[i] + 1))}%` }
                    ], timings_2);
                }

                left_instance = left_instance + ((100 / text_len) * (word_len[i] + 1));
            }
        }
        typing_animation();

        function changeText(event) {
            console.log(event)
            if (event.keyCode === 13 || event.type === "click") {
                var text = document.getElementById("text");
                console.log(text.innerHTML);

                if (text.innerHTML === "$ whoami") {
                    text.innerHTML = "$ This is Abhishek.";

                // else {
                //     text.innerHTML = "Hello";
                // }
            }
        }
        document.onkeypress = changeText;
        document.getElementById("whoami").addEventListener("click", changeText);


        // PAGE 3 CARDS - Function to Create Magical Stars
        function createMagicalStars(cardElement) {
            const particleCount = 15; // Number of stars
            const rect = cardElement.getBoundingClientRect(); // Get card position and dimensions

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                // Randomize position: around the card's top and sides
                const edge = Math.random() < 0.5 ? 'horizontal' : 'vertical'; // Randomize edge
                let startX, startY;

                if (edge === 'horizontal') {
                    // Horizontal edges (top or bottom)
                    startX = rect.left + Math.random() * rect.width; // Random point along the card's width
                    startY = rect.top; // Top of the card
                } else {
                    // Vertical edges (left or right)
                    startX = Math.random() < 0.5 ? rect.left : rect.right; // Left or right of the card
                    startY = rect.top + Math.random() * rect.height; // Random point along the card's height
                }

                // Random angle and distance for star movement
                const angle = Math.random() * Math.PI * 2; // Random angle (0 to 360 degrees)
                const distance = Math.random() * 150 + 50; // Random distance (50px to 200px)
                const endX = startX + Math.cos(angle) * distance; // Move outward
                const endY = startY + Math.sin(angle) * distance;

                // Style the particle
                particle.style.left = `${startX}px`;
                particle.style.top = `${startY}px`;
                particle.style.position = 'fixed'; // Fixed to ensure proper positioning
                particle.style.transform = `translate(0, 0)`; // Start at the edge
                particle.style.opacity = 1; // Fully visible at the start

                // Append the particle to the body
                document.body.appendChild(particle);

                // Trigger outward animation
                requestAnimationFrame(() => {
                    particle.style.transform = `translate(${endX - startX}px, ${endY - startY}px) scale(1.2)`;
                    particle.style.opacity = 0; // Gradual fade-out
                });

                // Remove the particle after animation ends
                setTimeout(() => {
                    particle.remove();
                }, 1500); // Matches the animation duration
            }
        }

    </script>
